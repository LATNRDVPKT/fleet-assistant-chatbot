# nginx: one public port (80) in front of the UI and the API.
server {
    listen 80;
    client_max_body_size 1m;

    # API routes → FastAPI
    location ~ ^/(v1|health|docs|openapi.json|metrics) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;          # longer than the LLM timeout (20 s) + retries
    }

    # Everything else → Streamlit UI (needs websocket upgrade headers)
    location / {
        proxy_pass http://ui:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
